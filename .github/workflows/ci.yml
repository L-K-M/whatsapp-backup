name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources (syntax check)
        run: python -m compileall app

      # docker/metadata-action labels images with the repository license
      # alone. The image bundles more, so the Dockerfile states the full
      # expression and the release workflow must pass it through.
      - name: Check the image license label is declared
        run: |
          python3 scripts/licenses/oci-licenses.py dockerfile Dockerfile
          grep -q 'image.licenses=.*steps.oci.outputs.licenses' .github/workflows/release.yml

      # The UI package is whatsapp-backup's own code, so its manifest states
      # the root license (LICENSE, Unlicense).
      - name: Check the UI package license
        run: |
          grep -q '"license": "Unlicense"' ui/package.json

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon (still not pushed) so the next step can
      # look inside it.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: whatsapp-backup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image carries the notices of wacli, its Go modules, the web UI and
      # the OS packages, and its license label names every license they list.
      # tini: MIT, installed by name for PID 1.
      - name: Verify notices in the image
        run: |
          sh scripts/licenses/check-image-notices.sh whatsapp-backup:ci /usr/share/doc/whatsapp-backup \
            Third-Party-Notices.txt OS-Packages.txt LICENSE \
            -- --own Unlicense --package tini=MIT
          docker run --rm --entrypoint test whatsapp-backup:ci -s /app/web/Third-Party-Notices.txt
