name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources (syntax check)
        run: python -m compileall app

      # docker/metadata-action labels images with the repository license
      # alone. The image bundles more, so the Dockerfile states the full
      # expression and the release workflow must pass it through.
      - name: Check the image license label is declared
        run: |
          python3 scripts/licenses/oci-licenses.py dockerfile Dockerfile
          grep -q 'image.licenses=.*steps.oci.outputs.licenses' .github/workflows/release.yml

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
